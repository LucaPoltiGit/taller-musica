name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK de debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk loopera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: loopera-apk
          path: loopera.apk

      - name: Publicar en el Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mover el tag "latest" al commit actual
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "latest" \
              --notes "APK de Loopera compilado desde ${GITHUB_SHA::7}."
          else
            gh release create latest --title "latest" \
              --notes "APK de Loopera compilado desde ${GITHUB_SHA::7}."
          fi
          # --clobber reemplaza el APK anterior
          gh release upload latest loopera.apk --clobber
